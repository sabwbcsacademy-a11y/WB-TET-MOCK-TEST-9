  let timeInSeconds = 40 * 60; // 40 minutes timer
  let timerInterval;

  // Validation function for Bengali & English Name & 10-digit Phone
  function validateAndStart() {
    const nameInput = document.getElementById('student-name').value.trim();
    const phoneInput = document.getElementById('student-phone').value.trim();
    const nameErr = document.getElementById('name-error');
    const phoneErr = document.getElementById('phone-error');

    let isValid = true;

    // RegEx: English letters (a-z, A-Z) + Bengali Unicode Range (\u0980-\u09FF) + spaces only
    const nameRegex = /^[a-zA-Z\u0980-\u09FF\s]+$/;
    // RegEx: Exactly 10 digits
    const phoneRegex = /^[0-9]{10}$/;

    if (!nameRegex.test(nameInput)) {
      nameErr.style.display = 'block';
      isValid = false;
    } else {
      nameErr.style.display = 'none';
    }

    if (!phoneRegex.test(phoneInput)) {
      phoneErr.style.display = 'block';
      isValid = false;
    } else {
      phoneErr.style.display = 'none';
    }

    if (isValid) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('test-section').style.display = 'block';
      renderQuestions();
      startTimer();
    }
  }

  function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'question-card';

      let optionsHtml = '';
      for (const [key, val] of Object.entries(item.options)) {
        optionsHtml += `
          <li>
            <label id="lbl-${item.id}-${key}">
              <input type="radio" name="q${item.id}" value="${key}">
              ${key}. ${val}
            </label>
          </li>
        `;
      }

      card.innerHTML = `
        <div class="question-title">${item.q}</div>
        <ul class="options-list">${optionsHtml}</ul>
      `;
      container.appendChild(card);
    });
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      timeInSeconds--;
      let minutes = Math.floor(timeInSeconds / 60);
      let seconds = timeInSeconds % 60;

      document.getElementById('time-display').innerText = 
        `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

      if (timeInSeconds <= 0) {
        clearInterval(timerInterval);
        alert("Time limit reached! Submitting your test automatically...");
        submitTest();
      }
    }, 1000);
  }

  function submitTest() {
    clearInterval(timerInterval);

    let score = 0;
    const form = document.getElementById('quiz-form');
    const formData = new FormData(form);

    questions.forEach(item => {
      const userAns = formData.get(`q${item.id}`);
      const correctAns = item.ans;

      // Lock input options after submission
      const radios = document.getElementsByName(`q${item.id}`);
      radios.forEach(r => r.disabled = true);

      // Scoring evaluation (+1 for correct, 0 for incorrect/unattempted)
      if (userAns === correctAns) {
        score++;
      }

      // Preview Highlights: Correct = Green, Wrong Attempt = Red
      if (userAns) {
        if (userAns === correctAns) {
          document.getElementById(`lbl-${item.id}-${userAns}`).classList.add('opt-correct');
        } else {
          document.getElementById(`lbl-${item.id}-${userAns}`).classList.add('opt-wrong');
          document.getElementById(`lbl-${item.id}-${correctAns}`).classList.add('opt-correct');
        }
      } else {
        // Highlight correct option if student skipped question
        document.getElementById(`lbl-${item.id}-${correctAns}`).classList.add('opt-correct');
      }
    });

    // Display total result summary
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('score-text').innerHTML = `Your Final Score: <strong>${score} / ${questions.length}</strong>`;
    
    // Hide timer & submit button
    document.getElementById('timer-sticky').style.display = 'none';
    form.querySelector('button[type="button"]').style.display = 'none';

    // Post details to Google Sheets
    sendToGoogleSheet(score);
  }

  function sendToGoogleSheet(score) {
    if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL" || !GOOGLE_SCRIPT_URL) {
      console.warn("Google Apps Script URL is missing or not configured.");
      return;
    }

    const name = document.getElementById('student-name').value;
    const phone = document.getElementById('student-phone').value;

    const payload = {
      name: name,
      phone: phone,
      score: score,
      total: questions.length,
      timestamp: new Date().toLocaleString()
    };

    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => console.log("Data logged to Google Sheets."))
    .catch(err => console.error("Data submission failed:", err));
  }
</script>
